[project]
name = "moe-fingerprint-localisation"
version = "0.1.0"
description = "Null-controlled test of whether instructional fingerprints produce stable expert-routing signatures in a mixture-of-experts language model."
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.34.0",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "torch>=2.6.0",
    "transformers>=4.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
